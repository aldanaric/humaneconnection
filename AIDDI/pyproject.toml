[project]
name = "aiddi"
version = "2026.06"
description = "AIDDI - AI driven design instrument"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "python-dotenv",
    "openai",
    "gtts",
    "httpx",
    "pandas",
    "tiktoken>=0.11.0",
    "pypdf2>=3.0.1",
    "scikit-learn>=1.7.2",
    "pdf2image>=1.17.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "streamlit-ace>=0.1.1",
    "streamlit-monaco>=0.1.3",
    "google-genai",
    "playwright",
    "chromium",
    "markdown",
    "pypdf>=6.14.2",
    "bcrypt"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ui", "services", "pages"]
include = [
    "Home.py",
    "data/*",
    "static/*",
]
